[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shootingcsp"
version = "0.2.0"
description = "ShootingCSP: constrained crystal structure prediction powered by ShootingFlow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aobo Yang" },
]
keywords = [
  "crystal-structure-prediction",
  "generative-models",
  "flow-matching",
  "optimal-control",
  "materials-science",
  "shootingflow",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase",
  "matplotlib",
  "networkx",
  "numpy",
  "orjson",
  "packaging",
  "pymatgen",
  "scipy",
  "spglib",
  "torch",
]

[project.optional-dependencies]
shooting = [
  "fairchem-core>=2.21,<2.22",
  "numpy>=2.0,<2.5",
  "torch>=2.8,<2.9",
]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
shootingcsp-validate-constraints = "shootingcsp.config.__main__:main"
shootingcsp-generate = "shootingcsp.cli.generate:main"
shootingcsp-name-output = "shootingcsp.naming:main"
shootingcsp-render-vesta = "shootingcsp.vesta:main"
shootingcsp-train-flow = "shootingcsp.training.train_flow:main"

[project.urls]
Homepage = "https://github.com/aoyang17/ShootingCSP"
Repository = "https://github.com/aoyang17/ShootingCSP"
Issues = "https://github.com/aoyang17/ShootingCSP/issues"
Changelog = "https://github.com/aoyang17/ShootingCSP/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shootingcsp*"]
exclude = ["test*"]

[tool.setuptools.package-data]
shootingcsp = ["py.typed", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
